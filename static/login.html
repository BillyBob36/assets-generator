<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Assets Générator</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/png" href="/logo-rocket.png">
</head>
<body class="login-body">
  <main class="login-shell">
    <div class="login-card">
      <img class="login-mark" src="/logo-rocket.png" alt="">
      <h1 class="login-title">Assets Générator</h1>
      <p class="login-sub">Icônes 3D sur fond transparent · Azure GPT-Image 1.5</p>

      <a href="/auth/google/login" class="btn-google" id="login-btn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.5-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2L31.2 33.7c-2 1.5-4.5 2.3-7.2 2.3-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.5l6.2 4.8c-.4.4 6.6-4.8 6.6-14.3 0-1.3-.1-2.5-.4-3.5z"/></svg>
        Se connecter avec Google
      </a>

      <div class="login-error hidden" id="login-error"></div>

      <p class="login-restrict">
        Outil restreint — connexion réservée aux comptes Google autorisés.
      </p>
    </div>

    <div class="login-aside">
      <div class="aside-grid" aria-hidden="true">
        <img src="/previews/gold.png" alt="">
        <img src="/previews/chrome.png" alt="">
        <img src="/previews/crystal.png" alt="">
        <img src="/previews/neon.png" alt="">
        <img src="/previews/holographic.png" alt="">
        <img src="/previews/marble.png" alt="">
      </div>
    </div>
  </main>

<script>
const params = new URLSearchParams(location.search);
const err = params.get("error");
const email = params.get("email");
const errBox = document.getElementById("login-error");
if (err) {
  const messages = {
    unauthorized: `Le compte ${email ? `<strong>${email}</strong>` : "Google"} n'est pas autorisé sur cet outil. Demande l'accès à l'administrateur.`,
    invalid_state: "Session expirée — réessaie.",
    token_exchange: "Échec de l'échange de tokens avec Google.",
    unverified: "Ton adresse Google doit être vérifiée.",
    access_denied: "Connexion annulée.",
  };
  errBox.innerHTML = messages[err] || `Erreur : ${err}`;
  errBox.classList.remove("hidden");
}
// If already logged in, jump straight to the app.
fetch("/api/me").then((r) => { if (r.ok) location.href = "/"; }).catch(() => {});
</script>
</body>
</html>
